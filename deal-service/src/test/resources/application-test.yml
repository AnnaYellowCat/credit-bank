spring:
  datasource:
    url: jdbc:h2:mem:testdb;
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false

app:
  gateway:
    uri: http://localhost:8080
  calculator:
    offers: /calculator/offers
    credit: /calculator/calc