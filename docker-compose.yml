version: '3.9'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.15
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka:7.2.15
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-topics-setup:
    image: confluentinc/cp-kafka:7.2.15
    depends_on:
      - kafka
    entrypoint: [ '/bin/bash', '-c' ]
    command: |
      "
      while ! kafka-topics --bootstrap-server kafka:29092 --list; do
        sleep 1
      done
      
      kafka-topics --bootstrap-server kafka:29092 --create --topic finish-registration --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --topic create-documents --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --topic send-documents --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --topic send-ses --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --topic credit-issued --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --topic statement-denied --partitions 1 --replication-factor 1
      "